services:
  movie-torrent-finder:
    build: .
    image: movie-torrent-finder:latest
    container_name: movie-torrent-finder
    restart: unless-stopped

    # Every value lives in .env — copy .env.example and edit it.
    env_file:
      - .env

    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"

    volumes:
      # Saved .torrent files. On a Synology this is typically a share such as
      # /volume1/downloads/torrents that the download client watches.
      - ./data/torrents:/torrents
      # SQLite database. Losing it loses request history, not the files.
      - ./data/db:/data

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:${HTTP_PORT:-8080}/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
